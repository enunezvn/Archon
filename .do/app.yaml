# =============================================================================
# ALERTS (Optional - Configure monitoring)
# =============================================================================
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# =============================================================================
# INGRESS ROUTING (Customize domains if needed)
# =============================================================================
ingress:
  rules:
    # Main UI
    - component:
        name: archon-frontend
      match:
        path:
          prefix: /

    # API endpoints
    - component:
        name: archon-server
      match:
        path:
          prefix: /api

    - component:
        name: archon-server
      match:
        path:
          prefix: /socket.io

    # MCP endpoint for AI coding assistants
    - component:
        name: archon-mcp
      match:
        path:
          prefix: /mcp
